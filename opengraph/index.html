<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" href="/icon.png">
  </link>
  <title>OrangeC7 - Open Graph Test Page</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:title" content="Open Graph Test Page" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://orangec7.net" />
  <meta property="og:image" content="https://https://orangec7.net/favicon.ico" />

  <!-- Include the css file></!-->
  <link rel="stylesheet" type="text/css" href="/style.css">

  <script src="https://kit.fontawesome.com/6c9a99d5c3.js" crossorigin="anonymous"></script>

  <meta charset="utf-8">
</head>

<body>
  <div class="container">
    <header id="header"></header>

    <main id="main"></main>

    <footer id="footer"></footer>

    <script>
      fetch('/header.html').then(res => res.text()).then(text => {
        document.getElementById('header').innerHTML = text;
      });
      fetch('main.html').then(res => res.text()).then(text => {
        document.getElementById('main').innerHTML = text;
      });
      fetch('/footer.html').then(res => res.text()).then(text => {
        document.getElementById('footer').innerHTML = text;
      });
    </script>
  </div>
</body>

</html>
