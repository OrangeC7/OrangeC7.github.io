<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script>
    
    
    
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8" />

  </head>
  <body>
    <div class="explain">
      <p>
        INSERT = randomize barcode<br>
        DELETE = toggle highlight<br>
        ENTER = commit next character (backspace to go back)<br>
        END = reveal<br>
      </p>
      <p>
        Try to type out what the barcode encodes without looking!
      </p>
    </div>
    
    <main>
      <div class="settings-area"></div>
      
      <script src="scripts/constants.js"></script>
      <script src="scripts/settings.js"></script>
      <script src="scripts/BarcodeRenderer.js"></script>
      <script src="scripts/sketch.js"></script>
    </main>
  </body>
</html>
