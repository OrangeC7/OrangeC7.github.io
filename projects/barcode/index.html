<!doctype html>
<html lang="en">

<head>
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script>

  <link rel="icon" href="https://orangec7.net/icon.png">
  </link>
  <title>OrangeC7 - Barcode</title>

  <link rel="stylesheet" type="text/css" href="style.css" />
  <meta charset="utf-8" />

  <meta property="og:site_name" content="OrangeC7.net" />
  <meta property="og:title" content="Barcode Playground" />
  <meta property="og:description"
    content="Mess around with barcodes! I made this to see if it's possible to learn to read a barcode. No idea if this would help with that, but you can try!" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://orangec7.net/projects/barcode" />
  <meta property="og:image" content="https://orangec7.net/images/og-image.png" />
  <meta property="og:image:alt" content="Stylized text that reads, 'OC7.net'" />
</head>

<body>
  <div class="explain">
    <p>
      INSERT = randomize barcode<br />
      DELETE = toggle highlight<br />
      ENTER = commit next character (backspace to go back)<br />
      END = reveal<br />
    </p>
    <p>Try to type out what the barcode encodes without looking!</p>
  </div>

  <main>
    <div class="settings-area"></div>

    <script src="scripts/constants.js"></script>
    <script src="scripts/settings.js"></script>
    <script src="scripts/BarcodeRenderer.js"></script>
    <script src="scripts/sketch.js"></script>
  </main>
</body>

</html>
